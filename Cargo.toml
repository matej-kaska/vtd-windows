[package]
name = "vtd"
version = "0.2.0"
edition = "2024"
license = "Unlicense"
description = "Minimal offline Windows and Linux voice dictation"
repository = "https://github.com/matej-kaska/vtd-windows"
default-run = "vtd"

[features]
engine = ["dep:whisper-rs"]

[[bin]]
name = "vtd-engine"
path = "src/engine_main.rs"
required-features = ["engine"]

[dependencies]

[target.'cfg(windows)'.dependencies]
anyhow = "1"
cpal = "0.17"
hound = "3.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
whisper-rs = { version = "0.16", optional = true, features = ["vulkan", "raw-api"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_LibraryLoader", "Win32_System_Console", "Win32_System_Threading", "Win32_System_Memory", "Win32_System_DataExchange", "Win32_Security", "Win32_Graphics_Gdi"] }

[profile.release]
lto = "thin"
strip = true
